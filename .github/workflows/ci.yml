name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # DATABASE_URL is an environment secret of the CI environment (a dedicated
    # Neon branch), so the job must opt into that environment to read it.
    environment: CI
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from the packageManager field in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Annotation makes the test mode visible without reading job logs.
      - name: Report database test mode
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL set: real-database tests will run"
          else
            echo "::warning::DATABASE_URL not set: real-database tests are skipped"
          fi
      - run: pnpm test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: pnpm build
